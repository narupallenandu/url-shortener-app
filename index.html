<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h2>🔗 URL Shortener</h2>

    <form method="POST">
        <input type="text" name="url" placeholder="Enter long URL" required>
        <button type="submit">Shorten</button>
    </form>

    {% if short_url %}
        <p>Short URL: <a href="{{ short_url }}">{{ short_url }}</a></p>
    {% endif %}

    <hr>

    <h3>📊 Stats</h3>
    <a href="/stats">View All Links</a>

    {% if data %}
    <table border="1">
        <tr>
            <th>Short</th>
            <th>Original</th>
            <th>Clicks</th>
        </tr>
        {% for row in data %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
        </tr>
        {% endfor %}
    </table>
    {% endif %}

</body>
</html>
